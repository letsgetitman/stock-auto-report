name: Morning Stock Report

on:
  schedule:
    - cron: '0 22 * * 1-5' # 월~금 한국시간 오전 7시 실행
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v3를 v4로 업데이트
      - uses: actions/setup-python@v5 # v4를 v5로 업데이트
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
